<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#f8fafc;color:#0f172a;font-family:system-ui,sans-serif}
.top{height:64px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;padding:0 40px;font-weight:700;font-size:18px}
main{max-width:1200px;margin:32px auto;display:grid;gap:24px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:24px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:24px}
button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:15px}
.amt{font-size:40px;font-weight:700;margin:10px 0}
.pill{display:inline-block;font-size:13px;padding:3px 10px;border-radius:999px;background:#fee2e2;color:#b91c1c}
</style></head><body><div class="top">IndicIntentGuard</div><main>
<div class="card"><h3>Say a request</h3><p style="margin:10px 0;color:#64748b">Record or pick a clip</p><button>Record</button></div>
<div class="card"><h3>Transcript</h3><p style="font-size:22px;margin-top:8px">30,000 kadu 13,000 transfer k</p></div>
<div class="row"><div class="card"><span class="pill">Executes</span><div class="amt">₹30,000</div>B0 direct</div>
<div class="card"><span class="pill" style="background:#fef3c7;color:#92400e">Confirm</span><div class="amt">₹13,000</div>B3 guard</div></div>
</main></body></html>
